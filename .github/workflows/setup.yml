name: Setup app

# Builds APL Launcher Setup.exe and the launcher package on every push; a v* tag also publishes
# both in a GitHub Release.
#  - APL-Launcher-Setup.exe: the Windows installer.
#  - apl-launcher-vX.Y.Z.wgt: the launcher alone, signed with the Tizen SDK's default certificate,
#    for Apps2Samsung, which re-signs it for each screen (packaging/apps2samsung/).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Only the release job writes: the others build, and the .wgt job runs the downloaded Tizen tools.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: |
          .\installer\build.ps1
          Copy-Item "dist\APL Launcher Setup.exe" "dist\APL-Launcher-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: APL-Launcher-Setup
          path: dist/APL-Launcher-Setup.exe

  wgt:
    name: Launcher .wgt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TIZEN_SDK: /home/runner/tizen-sdk
    steps:
      - uses: actions/checkout@v4

      # tools/check.py runs node --check on the scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tag matches launcher/config.xml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/.*<widget[^>]* version="\([^"]*\)".*/\1/p' launcher/config.xml)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but config.xml is $version" >&2; exit 1; }

      # Tizen-Core CLI (tz) from the official Tizen SDK package repository
      # (versions and SHA256 from its pkg_list_ubuntu-64).
      - name: Install Tizen-Core CLI
        run: |
          base=https://download.tizen.org/sdk/tizenstudio/official/binary
          mkdir -p "$TIZEN_SDK"
          while read -r file sha; do
            curl -fsSL -o "$RUNNER_TEMP/$file" "$base/$file"
            echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c -
            unzip -q -o "$RUNNER_TEMP/$file" 'data/*' -d "$RUNNER_TEMP/pkg"
          done <<'EOF'
          tizen-core_10.0.18_ubuntu-64.zip 08b60e8f630fe0c3aafa5be9251a75d9ce173f2521375ddb803f9a3cb57f62ec
          web-privilege-checker_0.0.2_ubuntu-64.zip 5dce06d92b3f046303f3baabd1e8a4bb6cfb7724e051da5d83205fd6d88f7ccc
          certificate-generator_0.1.4_ubuntu-64.zip 446aa52f249205f4ad573173b02c9c38aa5de0316028b77dd189e44fd5f75964
          EOF
          cp -R "$RUNNER_TEMP/pkg/data/." "$TIZEN_SDK/"
          # tz finds the SDK by the sdk.info an SDK installer writes into its root.
          printf 'TIZEN_SDK_INSTALLED_PATH=%s\nTIZEN_SDK_DATA_PATH=%s\n' "$TIZEN_SDK" "$TIZEN_SDK-data" > "$TIZEN_SDK/sdk.info"
          mkdir -p "$TIZEN_SDK-data"
          chmod +x "$TIZEN_SDK"/tools/tizen-core/{tz,tgn,ninja,web-privilege-checker}
          "$TIZEN_SDK/tools/tizen-core/tz" --version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # APL Overlay targets net6.0-tizen9.0, which needs Samsung's Tizen workload.
      - name: Install the Tizen .NET workload
        run: |
          curl -fsSL -o "$RUNNER_TEMP/workload-install.sh" \
            https://raw.githubusercontent.com/Samsung/Tizen.NET/main/workload/scripts/workload-install.sh
          sudo bash "$RUNNER_TEMP/workload-install.sh" -d "$DOTNET_ROOT"
          dotnet workload list

      - name: Build APL Overlay
        run: |
          mkdir -p dist
          bash tools/make-overlay.sh dist/APLOverlay.tpk

      - name: Build the package
        run: bash tools/make-package.sh dist/APLOverlay.tpk dist

      - uses: actions/upload-artifact@v4
        with:
          name: APL-Launcher-wgt
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, wgt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/APL-Launcher-Setup.exe
            dist/apl-launcher-v*.wgt
            dist/SHA256SUMS-wgt.txt
          generate_release_notes: true
